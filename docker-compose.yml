services:
  configurator:
    image: "${FRAPPE_IMAGE:-woodwolf-erpnext:v16.37.0}"
    pull_policy: always
    deploy:
      restart_policy:
        condition: none
    entrypoint:
      - bash
      - "-c"
    command:
      - >
        set -e;
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port $$SOCKETIO_PORT;
        bench set-config -g default_site $$SITE_NAME;
    environment:
      SITE_NAME: "${SITE_NAME}"
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE: "redis-cache:6379"
      REDIS_QUEUE: "redis-queue:6379"
      SOCKETIO_PORT: "9000"
    volumes:
      - "erpnext-sites:/home/frappe/frappe-bench/sites"
      - "erpnext-logs:/home/frappe/frappe-bench/logs"

  create-site:
    image: "frappe/erpnext:v16.37.0"
    pull_policy: always
    deploy:
      restart_policy:
        condition: none
    volumes:
      - "erpnext-sites:/home/frappe/frappe-bench/sites"
      - "erpnext-logs:/home/frappe/frappe-bench/logs"
    environment:
      SITE_NAME: "${SITE_NAME}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
      DB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
    entrypoint:
      - bash
      - "-c"
    command:
      - >
        wait-for-it -t 180 db:3306;
        wait-for-it -t 120 redis-cache:6379;
        sleep 10;
        if [ ! -d "sites/$${SITE_NAME}" ]; then
          echo "Creating new site $${SITE_NAME}...";
          bench new-site "$${SITE_NAME}" --mariadb-user-host-login-scope='%' --admin-password="$${ADMIN_PASSWORD}" --db-root-username=root --db-root-password="$${DB_ROOT_PASSWORD}" --install-app erpnext --set-default || echo "new-site failed, continuing";
          bench --site "$${SITE_NAME}" install-app hrms || echo "hrms install failed";
          bench --site "$${SITE_NAME}" install-app crm || echo "crm install failed";
        fi;
        echo "Running migrate...";
        bench --site "$${SITE_NAME}" migrate || echo "migrate failed, continuing";
        echo "Site setup complete.";
    depends_on:
      configurator:
        condition: service_completed_successfully
      db:
        condition: service_healthy

  backend:
    image: "${FRAPPE_IMAGE:-woodwolf-erpnext:v16.37.0}"
    pull_policy: never
    deploy:
      restart_policy:
        condition: on-failure
    volumes:
      - "erpnext-sites:/home/frappe/frappe-bench/sites"
      - "erpnext-logs:/home/frappe/frappe-bench/logs"
    depends_on:
      create-site:
        condition: service_completed_successfully
      configurator:
        condition: service_completed_successfully

  frontend:
    image: "${FRAPPE_IMAGE:-woodwolf-erpnext:v16.37.0}"
    pull_policy: never
    deploy:
      restart_policy:
        condition: on-failure
    command:
      - nginx-entrypoint.sh
    environment:
      BACKEND: "backend:8000"
      SOCKETIO: "websocket:9000"
      FRAPPE_SITE_NAME_HEADER: "${SITE_NAME}"
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
    volumes:
      - "erpnext-sites:/home/frappe/frappe-bench/sites"
      - "erpnext-logs:/home/frappe/frappe-bench/logs"
    depends_on:
      - backend
      - websocket

  websocket:
    image: "${FRAPPE_IMAGE:-woodwolf-erpnext:v16.37.0}"
    pull_policy: never
    deploy:
      restart_policy:
        condition: on-failure
    command:
      - node
      - /home/frappe/frappe-bench/apps/frappe/socketio.js
    volumes:
      - "erpnext-sites:/home/frappe/frappe-bench/sites"
      - "erpnext-logs:/home/frappe/frappe-bench/logs"
    environment:
      FRAPPE_REDIS_CACHE: "redis://redis-cache:6379"
      FRAPPE_REDIS_QUEUE: "redis://redis-queue:6379"
    depends_on:
      create-site:
        condition: service_completed_successfully
      configurator:
        condition: service_completed_successfully

  queue-short:
    image: "${FRAPPE_IMAGE:-woodwolf-erpnext:v16.37.0}"
    pull_policy: never
    deploy:
      restart_policy:
        condition: on-failure
    command:
      - bench
      - worker
      - "--queue"
      - "short,default"
    volumes:
      - "erpnext-sites:/home/frappe/frappe-bench/sites"
      - "erpnext-logs:/home/frappe/frappe-bench/logs"
    depends_on:
      create-site:
        condition: service_completed_successfully
      configurator:
        condition: service_completed_successfully

  queue-long:
    image: "${FRAPPE_IMAGE:-woodwolf-erpnext:v16.37.0}"
    pull_policy: never
    deploy:
      restart_policy:
        condition: on-failure
    command:
      - bench
      - worker
      - "--queue"
      - "long,default,short"
    volumes:
      - "erpnext-sites:/home/frappe/frappe-bench/sites"
      - "erpnext-logs:/home/frappe/frappe-bench/logs"
    depends_on:
      create-site:
        condition: service_completed_successfully
      configurator:
        condition: service_completed_successfully

  scheduler:
    image: "${FRAPPE_IMAGE:-woodwolf-erpnext:v16.37.0}"
    pull_policy: never
    deploy:
      restart_policy:
        condition: on-failure
    command:
      - bench
      - schedule
    volumes:
      - "erpnext-sites:/home/frappe/frappe-bench/sites"
      - "erpnext-logs:/home/frappe/frappe-bench/logs"
    depends_on:
      create-site:
        condition: service_completed_successfully
      configurator:
        condition: service_completed_successfully

  db:
    image: "mariadb:11.8"
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
      - "--skip-character-set-client-handshake"
    environment:
      MYSQL_ROOT_PASSWORD: "${SERVICE_PASSWORD_DB}"
      MARIADB_ROOT_PASSWORD: "${SERVICE_PASSWORD_DB}"
    volumes:
      - "erpnext-db-data:/var/lib/mysql"
    healthcheck:
      test:
        - CMD
        - healthcheck.sh
        - "--connect"
        - "--innodb_initialized"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis-cache:
    image: "redis:6.2-alpine"

  redis-queue:
    image: "redis:6.2-alpine"
    volumes:
      - "erpnext-redis-queue-data:/data"

volumes:
  erpnext-db-data:
  erpnext-redis-queue-data:
  erpnext-sites:
  erpnext-logs:
